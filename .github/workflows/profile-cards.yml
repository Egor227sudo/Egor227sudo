name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-cards

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Snake
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Streak, light
        uses: DenverCoder1/github-readme-streak-stats@v1.8.0
        with:
          options: user=${{ github.repository_owner }}&locale=ru&theme=default&hide_border=true&disable_animations=true
          path: dist/streak.svg

      - name: Streak, dark
        uses: DenverCoder1/github-readme-streak-stats@v1.8.0
        with:
          options: user=${{ github.repository_owner }}&locale=ru&theme=github-dark&hide_border=true&disable_animations=true
          path: dist/streak-dark.svg

      # One commit on a branch of its own, rewritten every run: main keeps no daily history.
      - name: Publish to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update profile cards"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" output

      # A scheduled workflow is switched off after 60 days without repository activity.
      - name: Keep the schedule on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/profile-cards.yml/enable"
